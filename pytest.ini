[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -m "not live"
markers =
    unit: Fast unit tests for pure logic, normalization, hashing, and planning.
    integration: Integration tests with real SQLite, temporary filesystem, and local HTTP audio streams.
    functional: Full functional backend workflow tests.
    gui: CustomTkinter GUI component and interaction tests.
    e2e: End-to-end user workflows using deterministic local test services.
    live: Opt-in tests against external live web sources (skipped by default in CI/standard runs).
    slow: Tests that take longer than normal to run.
